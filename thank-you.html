<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Strait Arrow</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --gold: #c8922a; --black: #111; --off-white: #f4f1ec; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black); color: var(--off-white);
    font-family: 'Barlow', sans-serif; font-weight: 300;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px 24px;
  }
  .checkmark { font-size: 72px; margin-bottom: 24px; }
  .tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 16px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 96px); line-height: 0.95;
    color: #fff; letter-spacing: 2px; margin-bottom: 24px;
  }
  h1 span { color: var(--gold); }
  p { font-size: 17px; color: #888; max-width: 480px; line-height: 1.7; margin-bottom: 40px; }
  a {
    background: var(--gold); color: var(--black);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
    padding: 16px 36px; text-decoration: none; display: inline-block;
    transition: background 0.2s;
  }
  a:hover { background: #e6ae4a; }
</style>
</head>
<body>
  <div class="checkmark">✅</div>
  <div class="tag">Strait Arrow General Contracting</div>
  <h1>We Got<br>Your <span>Request!</span></h1>
  <p>Thanks for reaching out. A member of our team will be in touch within one business day to discuss your project and set up your free estimate.</p>
  <a href="/">← Back to Home</a>
</body>
</html>
